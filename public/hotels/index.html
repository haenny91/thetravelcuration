<!DOCTYPE html>
<html lang="ko">
<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotels - The Travel Curation</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-main: #1a202c;
            --text-sub: #4a5568;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            padding: 20px; 
            margin: 0; 
            color: var(--text-main); 
        }
        .header { text-align: center; margin: 60px 0 40px; }
        .header h1 { font-size: 2.2rem; font-weight: 800; margin: 0; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 35px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px;
        }
        .card { 
            background: var(--card-bg); 
            border-radius: 24px; 
            overflow: hidden; 
            box-shadow: var(--shadow); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            text-decoration: none; 
            color: inherit; 
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .card:hover { 
            transform: translateY(-12px); 
            box-shadow: 0 25px 50px rgba(0,0,0,0.12); 
        }
        .card-img { 
            width: 100%;
            height: 220px; 
            background: #f7fafc center/cover no-repeat; 
        }
        .card-body { padding: 28px; flex-grow: 1; }
        .card-meta { font-size: 0.85rem; color: #a0aec0; margin-bottom: 12px; font-weight: 500; }
        .card-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 14px; line-height: 1.4; }
        .card-text { color: var(--text-sub); font-size: 0.95rem; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; padding: 10px; }
            .header { margin: 40px 0 20px; }
            .card-img { height: 200px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Hotels</h1>
    </div>
    <div class="grid">
        
    </div>
</body>
</html>
