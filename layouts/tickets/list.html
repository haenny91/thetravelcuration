<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - The Travel Curation</title>
    <style>
        body { font-family: sans-serif; background: #ffffff; padding: 20px; margin: 0; }
        .header { text-align: center; margin: 40px 0; font-size: 2.2rem; font-weight: 800; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 30px; 
            max-width: 1100px; 
            margin: 0 auto; 
        }
        .card { 
            background: white; border-radius: 20px; overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); transition: 0.3s; 
            text-decoration: none; color: inherit; display: flex; flex-direction: column;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .card:hover { transform: translateY(-10px); }
        .card-img { width: 100%; height: 220px; background: #eee center/cover; }
        .card-body { padding: 25px; }
        .card-meta { font-size: 0.85rem; color: #a0aec0; margin-bottom: 10px; }
        .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; }
        .card-text { color: #4a5568; font-size: 0.95rem; line-height: 1.7; }
        @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">{{ .Title }}</div>
    <div class="grid">
        {{ range .Pages.ByDate.Reverse }}
        <a href="{{ .Permalink }}" class="card">
            <div class="card-img" style="background-image: url('{{ .Params.image | default "https://images.unsplash.com/photo-1436491865332-7a61a109c0f2?w=800" }}');"></div>
            <div class="card-body">
                <div class="card-meta">{{ .Date.Format "2006. 01. 02" }}</div>
                <div class="card-title">{{ .Title }}</div>
                <div class="card-text">{{ .Summary }}</div>
            </div>
        </a>
        {{ end }}
    </div>
</body>
</html>
